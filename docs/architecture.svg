<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How Gauge turns a question about a video into a measurement</title>
<desc id="d">The browser uploads a video and sends a typed or spoken question. The server plans with Muse Spark, tracks objects with SAM 3.1, checks and repairs the tracks, measures with deterministic Python, and has Muse Spark explain using only computed numbers, which code then verifies.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6a66"/></marker></defs>
<rect width="1200" height="940" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#17211f">How a question becomes a measurement</text>
<text x="30" y="60" font-size="13" fill="#5b6a66">Every number comes from code. The language model only writes words, and code checks every number in them.</text>
<rect x="30" y="80" width="270" height="720" rx="14" fill="#f1f7f5" stroke="#cfd8d4"/>
<text x="46" y="106" font-size="14" font-weight="700" fill="#17211f">Browser</text>
<text x="46" y="124" font-size="11.5" fill="#5b6a66">React · Vite · Tailwind · Recharts</text>
<rect x="370" y="80" width="460" height="720" rx="14" fill="#f8f6f0" stroke="#cfd8d4"/>
<text x="386" y="106" font-size="14" font-weight="700" fill="#17211f">Gauge server</text>
<text x="386" y="124" font-size="11.5" fill="#5b6a66">FastAPI · one process · background jobs</text>
<rect x="880" y="80" width="290" height="720" rx="14" fill="#faf2ea" stroke="#cfd8d4"/>
<text x="896" y="106" font-size="14" font-weight="700" fill="#17211f">Meta Model API</text>
<text x="896" y="124" font-size="11.5" fill="#5b6a66">api.meta.ai</text>
<rect x="390" y="148" width="420" height="64" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="404" y="174" font-size="14" font-weight="700" fill="#17211f">0  Speech to text (optional)</text>
<text x="404" y="193" font-size="12" fill="#5b6a66">Audio is converted to WAV by ffmpeg; the words go back</text>
<text x="404" y="208" font-size="12" fill="#5b6a66">to the question box for you to check</text>
<rect x="722.0" y="158" width="78.0" height="18" rx="9" fill="#b5612f"/>
<text x="761.0" y="171" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Meta model</text>
<rect x="390" y="226" width="420" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="404" y="252" font-size="14" font-weight="700" fill="#17211f">1  Probe and prepare</text>
<text x="404" y="271" font-size="12" fill="#5b6a66">ffprobe reads fps, size, rotation; ffmpeg makes it streamable</text>
<rect x="760.4" y="236" width="39.6" height="18" rx="9" fill="#2f6f68"/>
<text x="780.2" y="249" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">code</text>
<rect x="390" y="304" width="420" height="64" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="404" y="330" font-size="14" font-weight="700" fill="#17211f">2  Plan</text>
<text x="404" y="349" font-size="12" fill="#5b6a66">Muse Spark reads the question and 3 frames, drafts a JSON plan;</text>
<text x="404" y="364" font-size="12" fill="#5b6a66">code checks every phrase, number, unit and tool</text>
<rect x="722.0" y="314" width="78.0" height="18" rx="9" fill="#b5612f"/>
<text x="761.0" y="327" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Meta model</text>
<rect x="390" y="382" width="420" height="64" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="404" y="408" font-size="14" font-weight="700" fill="#17211f">3  Track</text>
<text x="404" y="427" font-size="12" fill="#5b6a66">SAM 3.1, one short phrase per object, cached by video content</text>
<rect x="722.0" y="392" width="78.0" height="18" rx="9" fill="#b5612f"/>
<text x="761.0" y="405" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Meta model</text>
<rect x="390" y="460" width="420" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="404" y="486" font-size="14" font-weight="700" fill="#17211f">4  Check and repair</text>
<text x="404" y="505" font-size="12" fill="#5b6a66">Gaps, low confidence, jumps, id switches: try another name,</text>
<text x="404" y="520" font-size="12" fill="#5b6a66">or re-acquire the object with a box prompt</text>
<rect x="760.4" y="470" width="39.6" height="18" rx="9" fill="#2f6f68"/>
<text x="780.2" y="483" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">code</text>
<rect x="390" y="538" width="420" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="404" y="564" font-size="14" font-weight="700" fill="#17211f">5  Measure</text>
<text x="404" y="583" font-size="12" fill="#5b6a66">Fits and physics in Python (pendulum, spring, free fall, momentum,</text>
<text x="404" y="598" font-size="12" fill="#5b6a66">counting...). Every number and its uncertainty is made here</text>
<rect x="760.4" y="548" width="39.6" height="18" rx="9" fill="#2f6f68"/>
<text x="780.2" y="561" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">code</text>
<rect x="390" y="616" width="420" height="64" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="404" y="642" font-size="14" font-weight="700" fill="#17211f">6  Explain</text>
<text x="404" y="661" font-size="12" fill="#5b6a66">Muse Spark writes from a sheet of computed facts; code rejects</text>
<text x="404" y="676" font-size="12" fill="#5b6a66">any number not in it and falls back to a code-written text</text>
<rect x="722.0" y="626" width="78.0" height="18" rx="9" fill="#b5612f"/>
<text x="761.0" y="639" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Meta model</text>
<rect x="390" y="694" width="420" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="404" y="720" font-size="14" font-weight="700" fill="#17211f">7  Result</text>
<text x="404" y="739" font-size="12" fill="#5b6a66">Answer ± uncertainty, tracks, chart series, CSV, how it was checked</text>
<rect x="760.4" y="704" width="39.6" height="18" rx="9" fill="#2f6f68"/>
<text x="780.2" y="717" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">code</text>
<line x1="600.0" y1="212" x2="600.0" y2="226" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600.0" y1="290" x2="600.0" y2="304" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600.0" y1="368" x2="600.0" y2="382" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600.0" y1="446" x2="600.0" y2="460" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600.0" y1="524" x2="600.0" y2="538" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600.0" y1="602" x2="600.0" y2="616" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600.0" y1="680" x2="600.0" y2="694" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="45" y="148" width="240" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="59" y="174" font-size="14" font-weight="700" fill="#17211f">Mic button</text>
<text x="59" y="193" font-size="12" fill="#5b6a66">Records up to 30 s</text>
<rect x="45" y="226" width="240" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="59" y="252" font-size="14" font-weight="700" fill="#17211f">Upload video</text>
<text x="59" y="271" font-size="12" fill="#5b6a66">Drag and drop, with progress</text>
<rect x="45" y="304" width="240" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="59" y="330" font-size="14" font-weight="700" fill="#17211f">Ask a question</text>
<text x="59" y="349" font-size="12" fill="#5b6a66">Typed, or spoken and checked</text>
<rect x="45" y="382" width="240" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="59" y="408" font-size="14" font-weight="700" fill="#17211f">Live progress</text>
<text x="59" y="427" font-size="12" fill="#5b6a66">Frames tracked, self-check log</text>
<rect x="45" y="694" width="240" height="64" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="59" y="720" font-size="14" font-weight="700" fill="#17211f">Answer and proof</text>
<text x="59" y="739" font-size="12" fill="#5b6a66">Overlay video, chart, CSV</text>
<line x1="285" y1="180.0" x2="390" y2="180.0" stroke="#5b6a66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="285" y1="258.0" x2="390" y2="258.0" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="285" y1="336.0" x2="390" y2="336.0" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="390" y1="414.0" x2="285" y2="414.0" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="337.5" y="408.0" font-size="11" fill="#5b6a66" text-anchor="middle">live events</text>
<line x1="390" y1="726.0" x2="285" y2="726.0" stroke="#5b6a66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="900" y="148" width="250" height="64" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="914" y="174" font-size="14" font-weight="700" fill="#17211f">Muse Voice Transcribe</text>
<text x="914" y="193" font-size="12" fill="#5b6a66">Spoken question to text</text>
<rect x="900" y="304" width="250" height="64" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="914" y="330" font-size="14" font-weight="700" fill="#17211f">Muse Spark 1.3</text>
<text x="914" y="349" font-size="12" fill="#5b6a66">Planner (sees 3 keyframes)</text>
<rect x="900" y="382" width="250" height="142" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="914" y="408" font-size="14" font-weight="700" fill="#17211f">SAM 3.1</text>
<text x="914" y="427" font-size="12" fill="#5b6a66">Finds and follows objects:</text>
<text x="914" y="442" font-size="12" fill="#5b6a66">boxes, masks, identity,</text>
<text x="914" y="457" font-size="12" fill="#5b6a66">confidence, per frame</text>
<rect x="900" y="616" width="250" height="64" rx="10" fill="#ffffff" stroke="#b5612f" stroke-width="2"/>
<text x="914" y="642" font-size="14" font-weight="700" fill="#17211f">Muse Spark 1.3</text>
<text x="914" y="661" font-size="12" fill="#5b6a66">Explainer (sees only the facts)</text>
<line x1="810" y1="180.0" x2="900" y2="180.0" stroke="#5b6a66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="810" y1="336.0" x2="900" y2="336.0" stroke="#5b6a66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="810" y1="414.0" x2="900" y2="414.0" stroke="#5b6a66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="810" y1="648.0" x2="900" y2="648.0" stroke="#5b6a66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="810" y1="492.0" x2="900" y2="492.0" stroke="#5b6a66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<rect x="370" y="822" width="460" height="58" rx="10" fill="#ffffff" stroke="#2f6f68" stroke-width="2"/>
<text x="386" y="847" font-size="14" font-weight="700" fill="#17211f">SQLite and data folder</text>
<text x="386" y="867" font-size="12" fill="#5b6a66">Jobs and every progress event, tracks, SAM results cached by video content</text>
<line x1="600.0" y1="800" x2="600.0" y2="822" stroke="#5b6a66" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="30" y="904" width="16" height="16" rx="4" fill="#fff" stroke="#2f6f68" stroke-width="2"/><text x="54" y="917" font-size="12" fill="#5b6a66">runs as plain code (deterministic, tested without any AI)</text>
<rect x="420" y="904" width="16" height="16" rx="4" fill="#fff" stroke="#b5612f" stroke-width="2"/><text x="444" y="917" font-size="12" fill="#5b6a66">calls a Meta model through the Meta Model API</text>
<line x1="760" y1="912" x2="800" y2="912" stroke="#5b6a66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="808" y="917" font-size="12" fill="#5b6a66">box-prompt retry, only when needed</text>
</svg>